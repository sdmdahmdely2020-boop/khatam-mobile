name: khatam_app
description: >
  Application mobile Khatam — sujets et corrigés du Baccalauréat mauritanien,
  publiés par de vrais professeurs. Connectée au backend khatam-backend déjà
  en production.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Appels HTTP vers l'API Khatam (REST classique, pas de GraphQL côté
  # backend) — package officiel Dart, minimal et bien connu.
  http: ^1.1.0

  # Utilisé pour préciser le Content-Type exact (ex. "application/pdf",
  # "image/jpeg") d'un fichier envoyé en multipart/form-data (upload de
  # document, copie d'élève pour la correction IA) — le serveur rejette tout
  # fichier dont le type déclaré ne correspond pas exactement à ce qu'il
  # attend (voir khatam-backend/src/lib/upload.js et submissionUpload.js).
  # Dépendance déjà présente transitivement via `http`, déclarée ici
  # explicitement pour rester stable si `http` change un jour sa propre
  # dépendance.
  http_parser: ^4.1.2

  # Sélection d'un fichier PDF depuis le stockage du téléphone — utilisé par
  # le professeur pour envoyer un nouveau document depuis l'app.
  file_picker: ^12.1.2

  # Prise de photo (appareil photo) ou sélection depuis la galerie — utilisé
  # par l'élève pour envoyer sa copie à la correction IA. `imageQuality` est
  # systématiquement précisé au moment de l'appel (voir ai_grading_service.dart)
  # pour forcer un ré-encodage en JPEG, y compris sur iPhone (qui utilise HEIC
  # par défaut, format que le serveur ne sait pas traiter).
  image_picker: ^1.2.3

  # Gestion d'état simple (ChangeNotifier + Provider) — suffisant pour la
  # taille de cette application, pas besoin de Bloc/Riverpod pour l'instant.
  provider: ^6.1.1

  # Stockage local léger : jeton de connexion, identifiant d'appareil
  # (Khatam limite chaque compte à un seul appareil actif, voir le backend).
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Génère la vraie icône de l'app Android (et l'icône adaptative moderne)
  # à partir des images de la charte graphique — voir la configuration
  # `flutter_launcher_icons:` tout en bas de ce fichier, et la commande à
  # lancer dans INSTRUCTIONS.md. N'affecte que la génération, ne fait pas
  # partie de l'app elle-même une fois construite.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Identité visuelle Khatam (lot 1 — logo), voir assets/branding/README.md
  # pour le détail de chaque fichier et les prochaines étapes (icône
  # d'application via flutter_launcher_icons, splash via
  # flutter_native_splash, polices Cairo/Manrope via google_fonts).
  assets:
    - assets/branding/png/
    - assets/branding/svg/
    # Illustrations de l'écran d'accueil (onboarding, lot 2) — 3 images, avec
    # variantes haute résolution dans le sous-dossier 2.0x/ (Flutter les
    # inclut automatiquement, pas besoin de les lister séparément).
    - assets/onboarding/
    # Icônes de matière (lot 3) — une par matière du Bac, utilisées dans le
    # catalogue/fiche document via SubjectIcon (core/theme/subject_icons.dart).
    - assets/subjects/

# Icône de l'application Android (logo Khatam, lot 1) — générée une seule
# fois via `dart run flutter_launcher_icons` (voir INSTRUCTIONS.md), PAS à
# chaque lancement de l'app. Deux images sources : une icône carrée classique
# (`image_path`, utilisée telle quelle sur les anciennes versions d'Android),
# et une icône "adaptative" moderne en deux calques (fond + premier plan) qui
# s'adapte à la forme imposée par le launcher du téléphone (rond, carré aux
# coins arrondis, "goutte d'eau"...). `adaptive_icon_foreground_inset: 0` car
# l'image source respecte déjà elle-même la marge de sécurité recommandée
# (le rond doré n'occupe qu'environ 70% du canevas 432×432) — laisser la
# valeur par défaut du paquet (16%) aurait rétréci le logo une seconde fois.
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/branding/png/app-icon-1024-square.png"
  adaptive_icon_background: "assets/branding/png/adaptive-background-432.png"
  adaptive_icon_foreground: "assets/branding/png/adaptive-foreground-432.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
